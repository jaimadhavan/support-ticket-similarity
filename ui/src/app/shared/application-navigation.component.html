<nav class="app-navigation" aria-label="Application pages">
  <a
    class="nav-button"
    [routerLink]="['/search']"
    [class.active]="activePage === 'search'"
    [attr.aria-current]="activePage === 'search' ? 'page' : null"
  >Ticket Similarity Search</a>
  @if (userRole === 'Admin') {
    <a
      class="nav-button"
      [routerLink]="['/categories']"
      [class.active]="activePage === 'categories'"
      [attr.aria-current]="activePage === 'categories' ? 'page' : null"
    >Manage Ticket Categories</a>
    <a
      class="nav-button"
      [routerLink]="['/tickets']"
      [class.active]="activePage === 'tickets'"
      [attr.aria-current]="activePage === 'tickets' ? 'page' : null"
    >Manage Tickets</a>
    <a
      class="nav-button"
      [routerLink]="['/historical']"
      [class.active]="activePage === 'historical'"
      [attr.aria-current]="activePage === 'historical' ? 'page' : null"
    >Manage Historical Tickets</a>
    <a
      class="nav-button"
      [routerLink]="['/analytics']"
      [class.active]="activePage === 'analytics'"
      [attr.aria-current]="activePage === 'analytics' ? 'page' : null"
    >System Analysis</a>
  }
</nav>
